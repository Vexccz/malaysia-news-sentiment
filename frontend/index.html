<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- Preconnect to critical origins -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
  <link rel="dns-prefetch" href="https://firebaseinstallations.googleapis.com" />
  <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />
  <link rel="dns-prefetch" href="https://www.googleapis.com" />

  <!-- Non-render-blocking charts.css (only used by CSS chart components) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/charts.css/dist/charts.min.css" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/charts.css/dist/charts.min.css" /></noscript>

  <!-- Primary Meta Tags -->
  <title>MY News Sentiment - AI-Powered Malaysian News Analysis</title>
  <meta name="description" content="Real-time AI-powered sentiment analysis for Malaysian news. Track sentiment trends, entity relationships, and source credibility across 50+ Malaysian news outlets." />
  <meta name="theme-color" content="#8B1A1A" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
  <link rel="canonical" href="https://mynewssentiment.com" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://mynewssentiment.com" />
  <meta property="og:title" content="MY News Sentiment - AI-Powered Malaysian News Analysis" />
  <meta property="og:description" content="Real-time AI-powered sentiment analysis for Malaysian news. Track sentiment trends, entity relationships, and source credibility across 50+ Malaysian news outlets." />
  <meta property="og:image" content="https://mynewssentiment.com/og-image.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://mynewssentiment.com" />
  <meta name="twitter:title" content="MY News Sentiment - AI-Powered Malaysian News Analysis" />
  <meta name="twitter:description" content="Real-time AI-powered sentiment analysis for Malaysian news. Track sentiment trends, entity relationships, and source credibility across 50+ Malaysian news outlets." />
  <meta name="twitter:image" content="https://mynewssentiment.com/og-image.png" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
